# Lint, type check, unit tests (Linux on the oldest and a recent Python, Windows) and a Docker build for every push and
# pull request.
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19"
      - run: uvx ruff@0.17.4 check src tests scripts
      - run: uvx mypy@1.18.2  # the modules listed under [tool.mypy] in pyproject.toml

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile -t funscript-gen .
      - run: docker run --rm funscript-gen --help

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - {os: ubuntu-latest, python: "3.11"}  # requires-python >= 3.11
          - {os: ubuntu-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19"  # the same uv as docker/Dockerfile
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run pytest -q
