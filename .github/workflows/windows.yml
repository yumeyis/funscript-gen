# The Windows portable build (packaging/windows/). Run by hand (Actions → Windows portable → Run workflow) to get the
# zip as a workflow artifact, or by pushing a version tag (git tag -a v1.0.0 -m v1.0.0 && git push origin v1.0.0), which also
# puts the zip on a draft release to review and publish.
name: Windows portable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # the draft release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19"  # the same uv as docker/Dockerfile

      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path src/funscript_gen/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but __version__ is $version" }

      - name: Unit tests
        shell: pwsh
        run: |
          uv sync --frozen
          uv run pytest -q

      - name: Build
        shell: pwsh
        run: ./packaging/windows/build.ps1 -OutDir dist -Commit "${{ github.sha }}"

      - name: Smoke test
        shell: pwsh
        run: |
          $app = Get-ChildItem dist -Directory -Filter "FunscriptGen-*-win64" | Select-Object -First 1
          ./packaging/windows/smoke-test.ps1 $app.FullName

      - uses: actions/upload-artifact@v7
        with:
          name: FunscriptGen-win64
          path: |
            dist/FunscriptGen-*-win64.zip
            dist/FunscriptGen-*-win64.zip.sha256
          retention-days: 14

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --title "funscript-gen ${{ github.ref_name }}" --generate-notes `
            (Get-ChildItem dist/FunscriptGen-*-win64.zip*).FullName
