# --- opt ---
"opt.use_ai.label" = "使用 AI 判斷每個鏡頭的區域、方向與部位"
"opt.focus.choice.general" = "一般（兩人之間的動作）"
"opt.focus.choice.hybrid" = "Hybrid（逐幀選擇：看得清楚用目標區域，看不清楚或被遮擋用一般區域）"
"opt.focus.label" = "分析目標"
"opt.focus.info" = "Hybrid 會同時做一般分析與目標區域分析（AI 框出目標部位與接觸部位、可能標出主動部位的方向），AI 時間約為兩倍；固定使用光流。"
"opt.region_pick.label" = "AI 從候選區域中再選一次分析區域"
"opt.region_pick.info" = "一般模式：把 AI 的區域、兩個人、兩人合併、整個畫面與 3×3 格子裁切給 AI 選，選到的區域節奏不比原本的弱才換（每個鏡頭多一次 AI 呼叫）。"
"opt.contact_pick.label" = "手和口都可能時跟著移動較大的"
"opt.contact_pick.info" = "Hybrid：AI 判斷的接觸部位機率前兩名是手和口時，讓 AI 分別框出手和口，改用移動較大的區域（這些鏡頭多 1–2 次 AI 呼叫；需要 vLLM，Ollama 不提供機率）。"
"opt.contact_min_prob.label" = "手和口：第二名的最低機率"
"opt.contact_min_prob.info" = "第二名（手或口）的機率低於這個值時，視為 AI 確定只有一個部位，不比較移動量。0 = 只要前兩名是手和口就比較。"
"opt.stroke_range.label" = "行程範圍辨識"
"opt.stroke_range.info" = "每個鏡頭讓 AI 判斷能否完整看到主動部位與它的前端（每個鏡頭多一次 AI 呼叫）；看不到前端代表行程到不了頂端，該鏡頭超過最大值的位置會截到最大值；看得到前端但主動部位不完整時，低於最小值的位置會提高到最小值。"
"opt.range_cap.label" = "看不到前端時的最大值"
"opt.range_floor.label" = "看得到前端但主動部位不完整時的最小值"
"opt.rest_empty.label" = "沒有人的鏡頭停在最高點"
"opt.rest_empty.info" = "AI 判斷畫面中沒有人的鏡頭（片頭、片尾、黑畫面）不分析動作，停在輸出範圍的最高點，和人工腳本靜止時的習慣一致。一般模式與 Hybrid 有效；手動指定分析區域時不執行。"
"opt.mode.choice.auto" = "自動（光流）"
"opt.mode.choice.flow" = "光流（特寫、動畫、第一人稱）"
"opt.mode.choice.pose" = "骨架（兩人全身入鏡；需要另外安裝 uv sync --extra pose）"
"opt.mode.label" = "計算方式"
"opt.axis.choice.vertical" = "垂直"
"opt.axis.choice.horizontal" = "水平"
"opt.axis.choice.depth" = "深度（靠近／遠離鏡頭）"
"opt.axis.choice.distance" = "距離 / 自動主軸"
"opt.axis.choice.auto" = "自動"
"opt.axis.label" = "動作方向"
"opt.roi.label" = "分析區域（覆寫 AI）"
"opt.roi.placeholder" = "留空 = AI 決定；例：0.3,0.4,0.7,0.8（x1,y1,x2,y2，0–1）"
"opt.ref_a.label" = "A 的部位（骨架模式）"
"opt.ref_b.label" = "B 的部位（骨架模式）"
"opt.range_low.label" = "範圍下限"
"opt.range_high.label" = "範圍上限"
"opt.amplitude.choice.preserve" = "保留幅度（小動作 → 短行程）"
"opt.amplitude.choice.fill" = "填滿行程（每下都走滿）"
"opt.amplitude.label" = "幅度模式"
"opt.gain.label" = "行程倍率（保留幅度模式；小於 1 讓整體動作變小）"
"opt.invert.label" = "上下反轉"
"opt.chunk_align.label" = "長鏡頭分段方向一致"
"opt.chunk_align.info" = "長鏡頭會切成 20 秒一段分析；以方向判斷最明確的一段為準，動作型態相同的其他段跟著對齊，避免某一段高低相反。"
"opt.asym_sign.label" = "依行程快慢判斷方向"
"opt.asym_sign.info" = "人工腳本多半是往下（推進）快、往上慢。鏡頭的動作明顯往上比往下快時，判定為高低相反並反轉該鏡頭；AI 給了主動部位方向的鏡頭不處理，不需要額外的 AI 呼叫。關閉時只在鏡頭表的備註提示「可能高低相反」。驗證素材上反轉的鏡頭都在 B02、B03、D02，人工腳本有明顯動作的鏡頭都改對，舊 8 段不變。"
"opt.asym_threshold.label" = "翻轉門檻（往上與往下最高速度比的對數；0.5 ≈ 快 1.65 倍，越小越容易反轉）"
"opt.asym_audio.label" = "以聲音確認"
"opt.asym_audio.info" = "撞擊聲通常在推進到底前一刻。聲音起點落在動作低點的鏡頭（看起來方向正確）維持原來的門檻；其他有聲音的鏡頭（起點在高點，或只有音樂、沒有明顯的撞擊聲）改用較低的門檻。口部接觸鏡頭的聲音常在頂端，所以聲音不會單獨決定反轉。"
"opt.asym_audio_threshold.label" = "聲音沒有反對時的翻轉門檻"
"opt.sound_hint.label" = "依聲音提示可能高低相反"
"opt.sound_hint.info" = "聲音起點落在動作高點、但沒有被反轉的鏡頭，列為「可能高低相反」並在預覽中標示。在調整門檻的素材上多半說對，在沒有用來調整的 13 段新素材上標出的 14 個鏡頭全部方向正確，所以預設關閉。"
"opt.part_sign.label" = "依部位框判斷方向"
"opt.part_sign.info" = "以動漫專用的偵測模型找出主動部位與對象部位的框：兩者分開＝退回＝高。距離的變化和動作相反的鏡頭反轉，反轉的鏡頭不再做快慢判斷。只處理有主動部位框的鏡頭；口部接觸與手部接觸鏡頭沒有對象部位框，不受影響。第一次使用會下載約 43 MB 的模型；在 CPU 上很慢（3 分鐘的影片約多 1 分多鐘，急著要結果時可以關閉），安裝 GPU 版 onnxruntime 後會自動使用 GPU；偵測結果會快取，同一支影片再產生時不必重新偵測。"
"opt.part_sign_threshold.label" = "翻轉門檻（距離和動作的相關低於負的這個值才反轉，越小越容易反轉）"
"opt.max_speed.label" = "最大速度（單位／秒）"
"opt.freq_limit.label" = "幅度縮小門檻（Hz，0 = 關閉）"
"opt.freq_max.label" = "幅度縮小最高頻率（Hz）"
"opt.freq_min_scale.label" = "最高頻率時的行程比例"
"opt.min_prominence.label" = "最小動作幅度（佔局部範圍的比例，越大越忽略小動作）"
"opt.rhythm_filter.label" = "節奏濾波（光流）"
"opt.rhythm_filter.info" = "鏡頭的動作節奏明顯時，濾掉節奏以外的晃動與漂移，找回被蓋住的動作點。"
"opt.dwell.label" = "保留轉折處的停頓"
"opt.dwell.info" = "動作在頂端或底端停留時，輸出停頓的開始與結束兩個點，而不是只有一個轉折點。"
"opt.dwell_tol.label" = "停頓判定範圍（佔行程的比例，越大越容易判為停頓）"
"opt.dwell_min_ms.label" = "最短停頓（毫秒）"
"opt.hold.label" = "停頓時保持原位"
"opt.hold.info" = "兩個動作點相隔太久時，停在原位置，到下一個點前才移動；關閉時慢慢移到下一個位置。開啟會把很慢的行程變成停住再快速移動。"
"opt.hold_after_ms.label" = "停頓門檻（動作點相隔超過幾毫秒）"
"opt.curve.label" = "長行程補點"
"opt.curve.info" = "峰與谷間隔較長時，在中間加點，讓輸出跟著動作的快慢變化，而不是一條直線。"
"opt.curve_after_ms.label" = "補點門檻（峰谷間隔超過幾毫秒）"
"opt.curve_tol.label" = "補點精細度（偏離直線多少才加點，越小點越多）"
"opt.bridge.label" = "鏡頭切換處銜接"
"opt.bridge.info" = "鏡頭切換處下一個動作點接不上前一個鏡頭的節奏（間隔太長，或兩邊都停在高點／低點）時，在空檔中複製一次前一個鏡頭的最後一個行程，而不是慢慢移過去或停住。"
"opt.scene_center.label" = "慢動作保留高低（實驗性）"
"opt.scene_center.info" = "沒有明顯節奏的鏡頭，以整個鏡頭的範圍決定位置，而不是 4 秒內的範圍，讓慢速的大動作保留高低。"
"opt.compute.label" = "整體"
"opt.compute.info" = "Auto：有可用的 GPU 就用，沒有就用 CPU；GPU：找不到可用的 GPU 時提醒並停止；CPU：一律用 CPU。下面的步驟選 Auto 時依照這個設定。AI 在 AI 主機上執行，不受影響。"
"opt.flow_compute.label" = "光流"
"opt.flow_compute.info" = "GPU 用 OpenCL（顯示卡驅動程式內建），比 CPU 快，數值和 CPU 有極小的差異。"
"opt.part_compute.label" = "部位框偵測"
"opt.part_compute.info" = "GPU 需要安裝 GPU 版的 onnxruntime（CUDA 或 DirectML）。"
"opt.pose_compute.label" = "骨架"
"opt.pose_compute.info" = "只在計算方式為「骨架」時使用；GPU 需要 CUDA 版的 PyTorch。"
"opt.fps.label" = "分析幀率"
"opt.max_side.label" = "分析解析度（長邊像素）"
"opt.flow_width.label" = "光流計算寬度（像素）"
"opt.flow_width.info" = "越小越快：320 約可省一半的光流時間，驗證素材的分數幾乎相同（F1 略升、相關係數略降）。"
"opt.flow_workers.label" = "同時計算光流的工作數"
"opt.flow_workers.info" = "影片切成每段最多 5 秒平行計算光流，輸出不變；越多越快，但會占用更多 CPU。"
"opt.scene_threshold.label" = "鏡頭切換靈敏度（越小越容易切分）"
"opt.use_reference.label" = "啟用參考腳本"
"opt.use_reference.info" = "開啟後可上傳人工製作的腳本，用來評分並在訊號圖與預覽中疊加比較（產生與預覽分頁都適用）。"

