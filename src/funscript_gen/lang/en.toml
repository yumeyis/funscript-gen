# --- opt ---
"opt.use_ai.label" = "Use the AI to decide each scene's region, axis and body parts"
"opt.focus.choice.general" = "General (the motion between the two people)"
"opt.focus.choice.hybrid" = "Hybrid (chosen per frame: the target region when it is clearly visible, the general region when it is unclear or occluded)"
"opt.focus.label" = "Analysis target"
"opt.focus.info" = "Hybrid does the general analysis and a target-region analysis together (the AI boxes the target part and the contact part, and may mark the direction of the active part), which takes about twice the AI time; it always uses optical flow."
"opt.region_pick.label" = "Let the AI pick the analysis region from candidates once more"
"opt.region_pick.info" = "General mode: the AI's region, each of the two people, both together, the whole picture and a 3×3 grid of crops are offered to the AI to choose from; the chosen region replaces the original one only if its rhythm is not weaker (one more AI call per scene)."
"opt.contact_pick.label" = "Follow the one that moves more when it may be the hand or the mouth"
"opt.contact_pick.info" = "Hybrid: when the AI's two most likely contact parts are the hand and the mouth, the AI boxes each of them and the region that moves more is used (1–2 more AI calls in those scenes; needs vLLM, Ollama gives no probabilities)."
"opt.contact_min_prob.label" = "Hand and mouth: the minimum probability of the second"
"opt.contact_min_prob.info" = "When the second (hand or mouth) is less likely than this, the AI is taken to be sure of one part and the motion is not compared. 0 = compare whenever the top two are the hand and the mouth."
"opt.stroke_range.label" = "Stroke range check"
"opt.stroke_range.info" = "For each scene the AI judges whether the whole active part and its tip can be seen (one more AI call per scene). If the tip is not seen the stroke cannot reach the top, so positions above the maximum are clipped to it; if the tip is seen but the active part is not whole, positions below the minimum are raised to it."
"opt.range_cap.label" = "Maximum when the tip is not seen"
"opt.range_floor.label" = "Minimum when the tip is seen but the active part is not whole"
"opt.rest_empty.label" = "Hold at the top in scenes with nobody"
"opt.rest_empty.info" = "Scenes in which the AI sees nobody (intros, endings, black frames) are not analysed and hold at the top of the output range, as hand-made scripts do when nothing moves. Works in general mode and Hybrid; not applied when the analysis region is set by hand."
"opt.mode.choice.auto" = "Automatic (optical flow)"
"opt.mode.choice.flow" = "Optical flow (close-ups, animation, first-person)"
"opt.mode.choice.pose" = "Skeleton (both people fully in frame; needs uv sync --extra pose)"
"opt.mode.label" = "Method"
"opt.axis.choice.vertical" = "Vertical"
"opt.axis.choice.horizontal" = "Horizontal"
"opt.axis.choice.depth" = "Depth (toward / away from the camera)"
"opt.axis.choice.distance" = "Distance / automatic main axis"
"opt.axis.choice.auto" = "Automatic"
"opt.axis.label" = "Motion axis"
"opt.roi.label" = "Analysis region (overrides the AI)"
"opt.roi.placeholder" = "Empty = the AI decides; e.g. 0.3,0.4,0.7,0.8 (x1,y1,x2,y2, 0–1)"
"opt.ref_a.label" = "Body part of A (skeleton mode)"
"opt.ref_b.label" = "Body part of B (skeleton mode)"
"opt.range_low.label" = "Range lower limit"
"opt.range_high.label" = "Range upper limit"
"opt.amplitude.choice.preserve" = "Keep the size (small motion → short stroke)"
"opt.amplitude.choice.fill" = "Fill the range (every stroke full length)"
"opt.amplitude.label" = "Stroke size mode"
"opt.gain.label" = "Stroke multiplier (keep-size mode; below 1 makes all motion smaller)"
"opt.invert.label" = "Flip upside down"
"opt.chunk_align.label" = "Same direction across the chunks of a long shot"
"opt.chunk_align.info" = "A long shot is analysed in 20 s chunks; the chunk whose direction is clearest decides, and other chunks with the same motion pattern are aligned to it, so one chunk is not upside down."
"opt.asym_sign.label" = "Decide the direction from stroke speed"
"opt.asym_sign.info" = "Hand-made scripts mostly fall fast (the push in) and rise slowly. When a scene's strokes clearly rise faster than they fall it is judged upside down and flipped; scenes for which the AI gave the direction of the active part are left alone, and no extra AI call is needed. When off, the scene table's note only says “possibly upside down”. On the validation clips the scenes it flips are in B02, B03 and D02, and every scene with clear motion in the hand-made script came out right; the old 8 clips are unchanged."
"opt.asym_threshold.label" = "Flip threshold (log of the rise/fall peak speed ratio; 0.5 ≈ 1.65× faster; lower flips more easily)"
"opt.asym_audio.label" = "Confirm with the sound"
"opt.asym_audio.info" = "The impact sound usually comes just before a push in bottoms out. Scenes whose sound onsets fall at the lows (the direction looks right) keep the usual threshold; other scenes with sound (onsets at the highs, or only music and no clear impacts) use a lower one. In mouth-contact scenes the sound is often at the top, so the sound alone never decides a flip."
"opt.asym_audio_threshold.label" = "Flip threshold when the sound does not object"
"opt.sound_hint.label" = "Point out possibly upside-down scenes from the sound"
"opt.sound_hint.info" = "Scenes whose sound onsets fall at the highs but were not flipped are listed as “possibly upside down” and marked in the preview. It was mostly right on the clips the threshold was tuned on, and all 14 scenes it marked on 13 new clips that were not used for tuning had the right direction, so it is off by default."
"opt.part_sign.label" = "Decide the direction from the part boxes"
"opt.part_sign.info" = "A detection model made for anime finds the boxes of the active part and the counterpart: apart = pulled back = high. A scene whose distance moves against the output is flipped, and flipped scenes get no speed check. Only scenes with an active-part box are handled; mouth-contact and hand-contact scenes have no counterpart box and are not affected. The first use downloads a model of about 43 MB; on the CPU it is slow (about 1 minute more for a 3-minute video; turn it off when in a hurry), and it uses the GPU automatically once a GPU build of onnxruntime is installed. Detections are cached, so generating the same video again does not detect again."
"opt.part_sign_threshold.label" = "Flip threshold (flip only when the distance's correlation with the motion is below minus this; lower flips more easily)"
"opt.max_speed.label" = "Maximum speed (units / s)"
"opt.freq_limit.label" = "Shrink threshold (Hz, 0 = off)"
"opt.freq_max.label" = "Highest frequency for shrinking (Hz)"
"opt.freq_min_scale.label" = "Stroke ratio at the highest frequency"
"opt.min_prominence.label" = "Minimum stroke size (fraction of the local range; larger ignores small motion)"
"opt.rhythm_filter.label" = "Rhythm filter (optical flow)"
"opt.rhythm_filter.info" = "When a scene's motion has a clear rhythm, wobble and drift outside it are filtered out, bringing back actions that were hidden."
"opt.dwell.label" = "Keep the rests at turning points"
"opt.dwell.info" = "When the motion rests at the top or bottom, output the start and the end of the rest instead of a single turning point."
"opt.dwell_tol.label" = "Rest range (fraction of the stroke; larger counts more as rests)"
"opt.dwell_min_ms.label" = "Shortest rest (ms)"
"opt.hold.label" = "Hold the position during pauses"
"opt.hold.info" = "When two actions are far apart in time, stay at the position and move only just before the next one; when off, move slowly to the next position. Turning this on makes a very slow stroke a hold followed by a quick move."
"opt.hold_after_ms.label" = "Pause threshold (ms between actions)"
"opt.curve.label" = "Add points on long strokes"
"opt.curve.info" = "When a peak and a valley are far apart in time, points are added between them so the output follows the changing speed of the motion instead of a straight line."
"opt.curve_after_ms.label" = "Point threshold (ms between peak and valley)"
"opt.curve_tol.label" = "Point detail (how far from the straight line before a point is added; lower gives more points)"
"opt.bridge.label" = "Bridge scene cuts"
"opt.bridge.info" = "At a cut where the next action does not continue the previous scene's rhythm (the gap is too long, or both sides rest at a high or low point), the previous scene's last stroke is copied once into the gap instead of moving slowly or holding."
"opt.scene_center.label" = "Keep the height of slow motion (experimental)"
"opt.scene_center.info" = "In scenes without a clear tempo, strokes are placed by the whole scene's range instead of a 4-second window's, so slow large strokes keep their height."
"opt.compute.label" = "Overall"
"opt.compute.info" = "Auto: a GPU when one is usable, otherwise the CPU; GPU: warn and stop when no usable GPU is found; CPU: always the CPU. The steps below follow this when they are set to Auto. The AI runs on the AI host and is not affected."
"opt.flow_compute.label" = "Optical flow"
"opt.flow_compute.info" = "The GPU uses OpenCL (built into the graphics driver) and is faster than the CPU; the numbers differ very slightly from the CPU's."
"opt.part_compute.label" = "Part detection"
"opt.part_compute.info" = "The GPU needs a GPU build of onnxruntime (CUDA or DirectML)."
"opt.pose_compute.label" = "Skeleton"
"opt.pose_compute.info" = "Only used when the method is “Skeleton”; the GPU needs PyTorch with CUDA."
"opt.fps.label" = "Analysis frame rate"
"opt.max_side.label" = "Analysis resolution (longest side, pixels)"
"opt.flow_width.label" = "Optical flow width (pixels)"
"opt.flow_width.info" = "Smaller is faster: 320 saves about half of the optical flow time and the scores on the validation clips are almost the same (F1 slightly up, correlation slightly down)."
"opt.flow_workers.label" = "Optical flow jobs at the same time"
"opt.flow_workers.info" = "The video is cut into pieces of up to 5 s whose optical flow is computed in parallel; the output does not change. More is faster but uses more CPU."
"opt.scene_threshold.label" = "Scene cut sensitivity (lower cuts more easily)"
"opt.use_reference.label" = "Use a reference script"
"opt.use_reference.info" = "When on, a hand-made script can be uploaded to score the result and to overlay it on the signal plot and in the preview (in both the Generate and Preview tabs)."

