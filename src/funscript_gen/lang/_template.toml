# --- opt ---
# zh-TW: 使用 AI 判斷每個鏡頭的區域、方向與部位
# en: Use the AI to decide each scene's region, axis and body parts
"opt.use_ai.label" = ""
# zh-TW: 一般（兩人之間的動作）
# en: General (the motion between the two people)
"opt.focus.choice.general" = ""
# zh-TW: Hybrid（逐幀選擇：看得清楚用目標區域，看不清楚或被遮擋用一般區域）
# en: Hybrid (chosen per frame: the target region when it is clearly visible, the general region when it is unclear or occluded)
"opt.focus.choice.hybrid" = ""
# zh-TW: 分析目標
# en: Analysis target
"opt.focus.label" = ""
# zh-TW: Hybrid 會同時做一般分析與目標區域分析（AI 框出目標部位與接觸部位、可能標出主動部位的方向），AI 時間約為兩倍；固定使用光流。
# en: Hybrid does the general analysis and a target-region analysis together (the AI boxes the target part and the contact part, and may mark the direction of the active part), which takes about twice the AI time; it always uses optical flow.
"opt.focus.info" = ""
# zh-TW: AI 從候選區域中再選一次分析區域
# en: Let the AI pick the analysis region from candidates once more
"opt.region_pick.label" = ""
# zh-TW: 一般模式：把 AI 的區域、兩個人、兩人合併、整個畫面與 3×3 格子裁切給 AI 選，選到的區域節奏不比原本的弱才換（每個鏡頭多一次 AI 呼叫）。
# en: General mode: the AI's region, each of the two people, both together, the whole picture and a 3×3 grid of crops are offered to the AI to choose from; the chosen region replaces the original one only if its rhythm is not weaker (one more AI call per scene).
"opt.region_pick.info" = ""
# zh-TW: 手和口都可能時跟著移動較大的
# en: Follow the one that moves more when it may be the hand or the mouth
"opt.contact_pick.label" = ""
# zh-TW: Hybrid：AI 判斷的接觸部位機率前兩名是手和口時，讓 AI 分別框出手和口，改用移動較大的區域（這些鏡頭多 1–2 次 AI 呼叫；需要 vLLM，Ollama 不提供機率）。
# en: Hybrid: when the AI's two most likely contact parts are the hand and the mouth, the AI boxes each of them and the region that moves more is used (1–2 more AI calls in those scenes; needs vLLM, Ollama gives no probabilities).
"opt.contact_pick.info" = ""
# zh-TW: 手和口：第二名的最低機率
# en: Hand and mouth: the minimum probability of the second
"opt.contact_min_prob.label" = ""
# zh-TW: 第二名（手或口）的機率低於這個值時，視為 AI 確定只有一個部位，不比較移動量。0 = 只要前兩名是手和口就比較。
# en: When the second (hand or mouth) is less likely than this, the AI is taken to be sure of one part and the motion is not compared. 0 = compare whenever the top two are the hand and the mouth.
"opt.contact_min_prob.info" = ""
# zh-TW: 行程範圍辨識
# en: Stroke range check
"opt.stroke_range.label" = ""
# zh-TW: 每個鏡頭讓 AI 判斷能否完整看到主動部位與它的前端（每個鏡頭多一次 AI 呼叫）；看不到前端代表行程到不了頂端，該鏡頭超過最大值的位置會截到最大值；看得到前端但主動部位不完整時，低於最小值的位置會提高到最小值。
# en: For each scene the AI judges whether the whole active part and its tip can be seen (one more AI call per scene). If the tip is not seen the stroke cannot reach the top, so positions above the maximum are clipped to it; if the tip is seen but the active part is not whole, positions below the minimum are raised to it.
"opt.stroke_range.info" = ""
# zh-TW: 看不到前端時的最大值
# en: Maximum when the tip is not seen
"opt.range_cap.label" = ""
# zh-TW: 看得到前端但主動部位不完整時的最小值
# en: Minimum when the tip is seen but the active part is not whole
"opt.range_floor.label" = ""
# zh-TW: 沒有人的鏡頭停在最高點
# en: Hold at the top in scenes with nobody
"opt.rest_empty.label" = ""
# zh-TW: AI 判斷畫面中沒有人的鏡頭（片頭、片尾、黑畫面）不分析動作，停在輸出範圍的最高點，和人工腳本靜止時的習慣一致。一般模式與 Hybrid 有效；手動指定分析區域時不執行。
# en: Scenes in which the AI sees nobody (intros, endings, black frames) are not analysed and hold at the top of the output range, as hand-made scripts do when nothing moves. Works in general mode and Hybrid; not applied when the analysis region is set by hand.
"opt.rest_empty.info" = ""
# zh-TW: 自動（光流）
# en: Automatic (optical flow)
"opt.mode.choice.auto" = ""
# zh-TW: 光流（特寫、動畫、第一人稱）
# en: Optical flow (close-ups, animation, first-person)
"opt.mode.choice.flow" = ""
# zh-TW: 骨架（兩人全身入鏡；需要另外安裝 uv sync --extra pose）
# en: Skeleton (both people fully in frame; needs uv sync --extra pose)
"opt.mode.choice.pose" = ""
# zh-TW: 計算方式
# en: Method
"opt.mode.label" = ""
# zh-TW: 垂直
# en: Vertical
"opt.axis.choice.vertical" = ""
# zh-TW: 水平
# en: Horizontal
"opt.axis.choice.horizontal" = ""
# zh-TW: 深度（靠近／遠離鏡頭）
# en: Depth (toward / away from the camera)
"opt.axis.choice.depth" = ""
# zh-TW: 距離 / 自動主軸
# en: Distance / automatic main axis
"opt.axis.choice.distance" = ""
# zh-TW: 自動
# en: Automatic
"opt.axis.choice.auto" = ""
# zh-TW: 動作方向
# en: Motion axis
"opt.axis.label" = ""
# zh-TW: 分析區域（覆寫 AI）
# en: Analysis region (overrides the AI)
"opt.roi.label" = ""
# zh-TW: 留空 = AI 決定；例：0.3,0.4,0.7,0.8（x1,y1,x2,y2，0–1）
# en: Empty = the AI decides; e.g. 0.3,0.4,0.7,0.8 (x1,y1,x2,y2, 0–1)
"opt.roi.placeholder" = ""
# zh-TW: A 的部位（骨架模式）
# en: Body part of A (skeleton mode)
"opt.ref_a.label" = ""
# zh-TW: B 的部位（骨架模式）
# en: Body part of B (skeleton mode)
"opt.ref_b.label" = ""
# zh-TW: 範圍下限
# en: Range lower limit
"opt.range_low.label" = ""
# zh-TW: 範圍上限
# en: Range upper limit
"opt.range_high.label" = ""
# zh-TW: 保留幅度（小動作 → 短行程）
# en: Keep the size (small motion → short stroke)
"opt.amplitude.choice.preserve" = ""
# zh-TW: 填滿行程（每下都走滿）
# en: Fill the range (every stroke full length)
"opt.amplitude.choice.fill" = ""
# zh-TW: 幅度模式
# en: Stroke size mode
"opt.amplitude.label" = ""
# zh-TW: 行程倍率（保留幅度模式；小於 1 讓整體動作變小）
# en: Stroke multiplier (keep-size mode; below 1 makes all motion smaller)
"opt.gain.label" = ""
# zh-TW: 上下反轉
# en: Flip upside down
"opt.invert.label" = ""
# zh-TW: 長鏡頭分段方向一致
# en: Same direction across the chunks of a long shot
"opt.chunk_align.label" = ""
# zh-TW: 長鏡頭會切成 20 秒一段分析；以方向判斷最明確的一段為準，動作型態相同的其他段跟著對齊，避免某一段高低相反。
# en: A long shot is analysed in 20 s chunks; the chunk whose direction is clearest decides, and other chunks with the same motion pattern are aligned to it, so one chunk is not upside down.
"opt.chunk_align.info" = ""
# zh-TW: 依行程快慢判斷方向
# en: Decide the direction from stroke speed
"opt.asym_sign.label" = ""
# zh-TW: 人工腳本多半是往下（推進）快、往上慢。鏡頭的動作明顯往上比往下快時，判定為高低相反並反轉該鏡頭；AI 給了主動部位方向的鏡頭不處理，不需要額外的 AI 呼叫。關閉時只在鏡頭表的備註提示「可能高低相反」。驗證素材上反轉的鏡頭都在 B02、B03、D02，人工腳本有明顯動作的鏡頭都改對，舊 8 段不變。
# en: Hand-made scripts mostly fall fast (the push in) and rise slowly. When a scene's strokes clearly rise faster than they fall it is judged upside down and flipped; scenes for which the AI gave the direction of the active part are left alone, and no extra AI call is needed. When off, the scene table's note only says “possibly upside down”. On the validation clips the scenes it flips are in B02, B03 and D02, and every scene with clear motion in the hand-made script came out right; the old 8 clips are unchanged.
"opt.asym_sign.info" = ""
# zh-TW: 翻轉門檻（往上與往下最高速度比的對數；0.5 ≈ 快 1.65 倍，越小越容易反轉）
# en: Flip threshold (log of the rise/fall peak speed ratio; 0.5 ≈ 1.65× faster; lower flips more easily)
"opt.asym_threshold.label" = ""
# zh-TW: 以聲音確認
# en: Confirm with the sound
"opt.asym_audio.label" = ""
# zh-TW: 撞擊聲通常在推進到底前一刻。聲音起點落在動作低點的鏡頭（看起來方向正確）維持原來的門檻；其他有聲音的鏡頭（起點在高點，或只有音樂、沒有明顯的撞擊聲）改用較低的門檻。口部接觸鏡頭的聲音常在頂端，所以聲音不會單獨決定反轉。
# en: The impact sound usually comes just before a push in bottoms out. Scenes whose sound onsets fall at the lows (the direction looks right) keep the usual threshold; other scenes with sound (onsets at the highs, or only music and no clear impacts) use a lower one. In mouth-contact scenes the sound is often at the top, so the sound alone never decides a flip.
"opt.asym_audio.info" = ""
# zh-TW: 聲音沒有反對時的翻轉門檻
# en: Flip threshold when the sound does not object
"opt.asym_audio_threshold.label" = ""
# zh-TW: 依聲音提示可能高低相反
# en: Point out possibly upside-down scenes from the sound
"opt.sound_hint.label" = ""
# zh-TW: 聲音起點落在動作高點、但沒有被反轉的鏡頭，列為「可能高低相反」並在預覽中標示。在調整門檻的素材上多半說對，在沒有用來調整的 13 段新素材上標出的 14 個鏡頭全部方向正確，所以預設關閉。
# en: Scenes whose sound onsets fall at the highs but were not flipped are listed as “possibly upside down” and marked in the preview. It was mostly right on the clips the threshold was tuned on, and all 14 scenes it marked on 13 new clips that were not used for tuning had the right direction, so it is off by default.
"opt.sound_hint.info" = ""
# zh-TW: 依部位框判斷方向
# en: Decide the direction from the part boxes
"opt.part_sign.label" = ""
# zh-TW: 以動漫專用的偵測模型找出主動部位與對象部位的框：兩者分開＝退回＝高。距離的變化和動作相反的鏡頭反轉，反轉的鏡頭不再做快慢判斷。只處理有主動部位框的鏡頭；口部接觸與手部接觸鏡頭沒有對象部位框，不受影響。第一次使用會下載約 43 MB 的模型；在 CPU 上很慢（3 分鐘的影片約多 1 分多鐘，急著要結果時可以關閉），安裝 GPU 版 onnxruntime 後會自動使用 GPU；偵測結果會快取，同一支影片再產生時不必重新偵測。
# en: A detection model made for anime finds the boxes of the active part and the counterpart: apart = pulled back = high. A scene whose distance moves against the output is flipped, and flipped scenes get no speed check. Only scenes with an active-part box are handled; mouth-contact and hand-contact scenes have no counterpart box and are not affected. The first use downloads a model of about 43 MB; on the CPU it is slow (about 1 minute more for a 3-minute video; turn it off when in a hurry), and it uses the GPU automatically once a GPU build of onnxruntime is installed. Detections are cached, so generating the same video again does not detect again.
"opt.part_sign.info" = ""
# zh-TW: 翻轉門檻（距離和動作的相關低於負的這個值才反轉，越小越容易反轉）
# en: Flip threshold (flip only when the distance's correlation with the motion is below minus this; lower flips more easily)
"opt.part_sign_threshold.label" = ""
# zh-TW: 最大速度（單位／秒）
# en: Maximum speed (units / s)
"opt.max_speed.label" = ""
# zh-TW: 幅度縮小門檻（Hz，0 = 關閉）
# en: Shrink threshold (Hz, 0 = off)
"opt.freq_limit.label" = ""
# zh-TW: 幅度縮小最高頻率（Hz）
# en: Highest frequency for shrinking (Hz)
"opt.freq_max.label" = ""
# zh-TW: 最高頻率時的行程比例
# en: Stroke ratio at the highest frequency
"opt.freq_min_scale.label" = ""
# zh-TW: 最小動作幅度（佔局部範圍的比例，越大越忽略小動作）
# en: Minimum stroke size (fraction of the local range; larger ignores small motion)
"opt.min_prominence.label" = ""
# zh-TW: 節奏濾波（光流）
# en: Rhythm filter (optical flow)
"opt.rhythm_filter.label" = ""
# zh-TW: 鏡頭的動作節奏明顯時，濾掉節奏以外的晃動與漂移，找回被蓋住的動作點。
# en: When a scene's motion has a clear rhythm, wobble and drift outside it are filtered out, bringing back actions that were hidden.
"opt.rhythm_filter.info" = ""
# zh-TW: 保留轉折處的停頓
# en: Keep the rests at turning points
"opt.dwell.label" = ""
# zh-TW: 動作在頂端或底端停留時，輸出停頓的開始與結束兩個點，而不是只有一個轉折點。
# en: When the motion rests at the top or bottom, output the start and the end of the rest instead of a single turning point.
"opt.dwell.info" = ""
# zh-TW: 停頓判定範圍（佔行程的比例，越大越容易判為停頓）
# en: Rest range (fraction of the stroke; larger counts more as rests)
"opt.dwell_tol.label" = ""
# zh-TW: 最短停頓（毫秒）
# en: Shortest rest (ms)
"opt.dwell_min_ms.label" = ""
# zh-TW: 停頓時保持原位
# en: Hold the position during pauses
"opt.hold.label" = ""
# zh-TW: 兩個動作點相隔太久時，停在原位置，到下一個點前才移動；關閉時慢慢移到下一個位置。開啟會把很慢的行程變成停住再快速移動。
# en: When two actions are far apart in time, stay at the position and move only just before the next one; when off, move slowly to the next position. Turning this on makes a very slow stroke a hold followed by a quick move.
"opt.hold.info" = ""
# zh-TW: 停頓門檻（動作點相隔超過幾毫秒）
# en: Pause threshold (ms between actions)
"opt.hold_after_ms.label" = ""
# zh-TW: 長行程補點
# en: Add points on long strokes
"opt.curve.label" = ""
# zh-TW: 峰與谷間隔較長時，在中間加點，讓輸出跟著動作的快慢變化，而不是一條直線。
# en: When a peak and a valley are far apart in time, points are added between them so the output follows the changing speed of the motion instead of a straight line.
"opt.curve.info" = ""
# zh-TW: 補點門檻（峰谷間隔超過幾毫秒）
# en: Point threshold (ms between peak and valley)
"opt.curve_after_ms.label" = ""
# zh-TW: 補點精細度（偏離直線多少才加點，越小點越多）
# en: Point detail (how far from the straight line before a point is added; lower gives more points)
"opt.curve_tol.label" = ""
# zh-TW: 鏡頭切換處銜接
# en: Bridge scene cuts
"opt.bridge.label" = ""
# zh-TW: 鏡頭切換處下一個動作點接不上前一個鏡頭的節奏（間隔太長，或兩邊都停在高點／低點）時，在空檔中複製一次前一個鏡頭的最後一個行程，而不是慢慢移過去或停住。
# en: At a cut where the next action does not continue the previous scene's rhythm (the gap is too long, or both sides rest at a high or low point), the previous scene's last stroke is copied once into the gap instead of moving slowly or holding.
"opt.bridge.info" = ""
# zh-TW: 慢動作保留高低（實驗性）
# en: Keep the height of slow motion (experimental)
"opt.scene_center.label" = ""
# zh-TW: 沒有明顯節奏的鏡頭，以整個鏡頭的範圍決定位置，而不是 4 秒內的範圍，讓慢速的大動作保留高低。
# en: In scenes without a clear tempo, strokes are placed by the whole scene's range instead of a 4-second window's, so slow large strokes keep their height.
"opt.scene_center.info" = ""
# zh-TW: 整體
# en: Overall
"opt.compute.label" = ""
# zh-TW: Auto：有可用的 GPU 就用，沒有就用 CPU；GPU：找不到可用的 GPU 時提醒並停止；CPU：一律用 CPU。下面的步驟選 Auto 時依照這個設定。AI 在 AI 主機上執行，不受影響。
# en: Auto: a GPU when one is usable, otherwise the CPU; GPU: warn and stop when no usable GPU is found; CPU: always the CPU. The steps below follow this when they are set to Auto. The AI runs on the AI host and is not affected.
"opt.compute.info" = ""
# zh-TW: 光流
# en: Optical flow
"opt.flow_compute.label" = ""
# zh-TW: GPU 用 OpenCL（顯示卡驅動程式內建），比 CPU 快，數值和 CPU 有極小的差異。
